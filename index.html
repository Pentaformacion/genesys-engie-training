<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Genesys Cloud CX - ENGIE Training
</title>

<link rel="stylesheet" href="styles.css">

</head>

<body>

<!-- LOGIN -->

<div id="login-screen">

    <div class="login-card">

        <div class="logo">
            GENESYS CLOUD CX
        </div>

        <div class="subtitle">
            ENGIE TRAINING
        </div>

        <input
            type="text"
            id="userName"
            placeholder="Nombre del colaborador">

        <button
            onclick="login('advisor')"
            class="btn-advisor">

            Entrar como Asesor

        </button>

        <button
            onclick="login('trainer')"
            class="btn-trainer">

            Entrar como Formador

        </button>

    </div>

</div>

<!-- VISTA ASESOR -->

<div
id="advisor-view"
style="display:none;">

<header class="topbar">

<div class="logo-small">

GENESYS

</div>

<div class="status-container">

<select id="agent-status">

<option>En Cola</option>

<option>Disponible</option>

<option>Capacitación</option>

<option>Descanso</option>

<option>Offline</option>

</select>

</div>

</header>

<div class="workspace">

<!-- MENU IZQUIERDO -->

<div class="sidebar">

<div class="icon active">
💬
</div>

<div class="icon">
📊
</div>

<div class="icon">
📁
</div>

<div class="icon">
📞
</div>

<div class="icon">
⚙️
</div>

</div>

<!-- PANEL CENTRAL -->

<div class="conversation-panel">

<div class="conversation-header">

<div>

Facebook Messenger

</div>

<div id="interaction-timer">

00:00

</div>

</div>

<div id="conversation-area">

<div class="queue-screen">

<div class="queue-icon">

💬

</div>

<div class="queue-title">

No hay conversaciones activas

</div>

<div class="queue-text">

Inicie nuevas conversaciones o
espere una interacción asignada.

</div>

</div>

</div>

<div class="message-box" id="message-box" style="display:none;">

<button>

📎

</button>

<input
id="message-input"
type="text"
placeholder="Escribe una respuesta">

<button id="send-btn" onclick="enviarMensaje()">
Enviar
</button>

</div>

</div>


<!-- PERFIL CLIENTE -->

<div class="customer-panel" style="display:none;">

<div class="panel-title">

Perfil

</div>

<div class="customer-card">

<label>
Nombre
</label>

<div id="customer-name">

Sin interacción

</div>

<hr>

<label>
Cuenta
</label>

<div id="customer-account">

-

</div>

<hr>

<label>
Dirección
</label>

<div id="customer-address">

-

</div>

<hr>

<label>
Segmento
</label>

<div id="customer-segment">

-

</div>

</div>

</div>

<!-- BIBLIOTECA -->

<div class="library-panel" style="display:none;">

<div class="panel-title">

Respuestas ENGIE

</div>

<input
class="search-box"
placeholder="Buscar...">

<div id="response-library">

</div>

</div>

</div>

</div>

<!-- VISTA FORMADOR -->

<div
id="trainer-view"
style="display:none;">

<header class="trainer-header">

FORMADOR ENGIE

</header>

<div class="trainer-workspace">

<div class="advisor-list">

<h3>

Asesores

</h3>

<button onclick="limpiarAsesores()"> 🗑 Limpiar Todo </button>

<div id="advisor-list">

</div>

</div>

<div class="monitor-panel">

<div class="panel-title">

Monitoreo

</div>

<div id="monitor-container">

</div>

</div>

<div class="case-panel">

<h3>

Generar Caso

</h3>

<button
onclick="generarCaso('Aclaración Factura')">

Aclaración Factura

</button>

<button>
Cambio Titular
</button>

<button>
Factura No Recibida
</button>

<button>
Emergencia Gas
</button>

<button>
Falta Suministro
</button>

</div>

</div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>

<script src="appfirebase.js"></script>

<script src="casos.js"></script>

</body>

</html>
