```html
<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Genesys ENGIE Training
</title>

<link
rel="stylesheet"
href="styles.css">

</head>

<body>

<!-- LOGIN -->

<div id="loginScreen">

    <div class="loginBox">

        <h1>
            GENESYS CLOUD CX
        </h1>

        <h3>
            ENGIE TRAINING
        </h3>

        <input
            type="text"
            id="userName"
            placeholder="Ingresa tu nombre">

        <br><br>

        <button
            onclick="login('advisor')">

            Entrar como Asesor

        </button>

        <br><br>

        <button
            onclick="login('trainer')">

            Entrar como Formador

        </button>

    </div>

</div>

<!-- ASESOR -->

<div
id="advisorView"
style="display:none;">

    <h1>
        Vista Asesor
    </h1>

    <h2 id="advisorName">
        Asesor
    </h2>

    <button
        onclick="logout()">

        Salir

    </button>

</div>

<!-- FORMADOR -->

<div
id="trainerView"
style="display:none;">

    <h1>
        Vista Formador
    </h1>

    <button
        onclick="logout()">

        Salir

    </button>

</div>

<script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>

<script src="firebase.js"></script>

</body>

</html>
