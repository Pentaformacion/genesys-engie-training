<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ENGIE Training Simulator</title>

<link rel="stylesheet" href="styles.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div id="app">

    <!-- LOGIN -->

    <section id="login-screen">

        <div class="login-card">

            <h1>Training CX</h1>

            <p>ENGIE</p>

            <input
                id="userName"
                type="text"
                placeholder="Nombre del colaborador">

            <button
                onclick="login('advisor')"
                class="btn-primary">

                Entrar como Asesor

            </button>

            <button
                onclick="login('trainer')"
                class="btn-secondary">

                Entrar como Formador

            </button>

        </div>

    </section>

    <!-- DASHBOARD -->

    <section
        id="advisor-view"
        style="display:none;">

        <header class="topbar">

            <div class="left-area">

                <button class="menu-btn">

                    <i class="fa-solid fa-bars"></i>

                </button>

                <div class="logo">

                    Training CX

                </div>

                <div class="search">

                    <i class="fa-solid fa-magnifying-glass"></i>

                    <input
                        placeholder="Buscar páginas, usuarios, grupos y ubicaciones">

                </div>

            </div>

            <div class="right-area">

                <button><i class="fa-solid fa-phone"></i></button>

                <button><i class="fa-regular fa-comments"></i></button>

                <button><i class="fa-solid fa-inbox"></i></button>

                <button><i class="fa-solid fa-users"></i></button>

                <select id="status">

                    <option>Fuera de la cola</option>

                    <option>Disponible</option>

                    <option>Ocupado</option>

                    <option>Ausente</option>

                    <option>Descanso</option>

                    <option>Comida</option>

                    <option>Capacitación</option>

                </select>

                <div class="avatar">

                    JV

                </div>

            </div>

        </header>

<main class="workspace">

    <!-- BARRA LATERAL -->

    <aside class="sidebar">

        <button class="side-btn active">
            <i class="fa-regular fa-comments"></i>
        </button>

        <button class="side-btn">
            <i class="fa-solid fa-phone"></i>
        </button>

        <button class="side-btn">
            <i class="fa-solid fa-inbox"></i>
        </button>

        <button class="side-btn">
            <i class="fa-solid fa-book"></i>
        </button>

        <button class="side-btn">
            <i class="fa-solid fa-gear"></i>
        </button>

    </aside>

    <!-- CONVERSACIONES -->

    <section class="conversation-list">

        <div class="panel-header">

            <h3>Conversaciones</h3>

            <button>

                <i class="fa-solid fa-ellipsis"></i>

            </button>

        </div>

        <div class="conversation-search">

            <input
                placeholder="Buscar conversación">

        </div>

        <div class="empty-conversations">

            <i class="fa-regular fa-comments"></i>

            <h4>No hay conversaciones</h4>

            <p>

                Esperando una nueva interacción...

            </p>

        </div>

    </section>

    <!-- CHAT -->

    <section class="chat-panel">

        <div class="chat-header">

            <div class="customer">

                <div class="customer-avatar">

                    FB

                </div>

                <div>

                    <strong>

                        Facebook Messenger

                    </strong>

                    <small>

                        Sin interacción

                    </small>

                </div>

            </div>

            <div class="chat-tools">

                <button>

                    <i class="fa-solid fa-phone"></i>

                </button>

                <button>

                    <i class="fa-solid fa-video"></i>

                </button>

                <button>

                    <i class="fa-solid fa-ellipsis"></i>

                </button>

            </div>

        </div>

        <div id="messages">

            <div class="welcome-screen">

                <i class="fa-regular fa-comments"></i>

                <h2>

                    No hay conversaciones activas

                </h2>

                <p>

                    Las conversaciones asignadas aparecerán aquí.

                </p>

            </div>

        </div>

        <div class="message-box">

            <button class="attach-btn">

                <i class="fa-solid fa-paperclip"></i>

            </button>

            <input
                id="message-input"
                type="text"
                placeholder="Escribe un mensaje...">

            <button
                id="send-btn">

                <i class="fa-solid fa-paper-plane"></i>

            </button>

        </div>

    </section>

    <!-- PERFIL -->

    <aside class="profile-panel">

        <div class="panel-header">

            <h3>Perfil</h3>

        </div>

        <div class="profile-content">

            <div class="profile-avatar">

                <i class="fa-solid fa-user"></i>

            </div>

            <div class="profile-field">

                <label>Nombre</label>

                <span id="customer-name">

                    Sin interacción

                </span>

            </div>

            <div class="profile-field">

                <label>Cuenta</label>

                <span id="customer-account">-</span>

            </div>

            <div class="profile-field">

                <label>Dirección</label>

                <span id="customer-address">-</span>

            </div>

            <div class="profile-field">

                <label>Segmento</label>

                <span id="customer-segment">-</span>

            </div>

        </div>

    </aside>

    <!-- BIBLIOTECA -->

    <aside class="knowledge-panel">

        <div class="panel-header">

            <h3>Biblioteca</h3>

        </div>

        <input
            class="knowledge-search"
            placeholder="Buscar respuesta...">

        <div id="knowledge-list">

        </div>

    </aside>

</main>

</section>

<script src="firebase.js"></script>

<script src="app.js"></script>

<script src="trainer.js"></script>

<script src="cases.js"></script>

</body>

</html>
