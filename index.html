<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ENGIE Training Simulator</title>

<link rel="stylesheet" href="styles.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div id="login-screen">

    <div class="login-card">

        <div class="login-logo">

            ENGIE

        </div>

        <h1>

            Training Simulator

        </h1>

        <p>

            Genesys Cloud CX

        </p>

        <input
        id="userName"
        type="text"
        placeholder="Nombre del colaborador">

        <div class="login-buttons">

            <button
            class="btn-primary"
            onclick="login('advisor')">

                Entrar como Asesor

            </button>

            <button
            class="btn-secondary"
            onclick="login('trainer')">

                Entrar como Formador

            </button>

        </div>

    </div>

</div>

<div
id="advisor-view"
style="display:none;">

<header class="gcx-header">

<div class="header-left">

<button class="menu-btn">

<i class="fa-solid fa-bars"></i>

</button>

<div class="gcx-brand">

Training CX

</div>

<div class="search-container">

<i class="fa-solid fa-magnifying-glass"></i>

<input
type="text"
placeholder="Buscar páginas, usuarios, grupos y ubicaciones">

</div>

</div>

<div class="header-right">

<button class="toolbar-btn">

<i class="fa-solid fa-phone"></i>

</button>

<button class="toolbar-btn active">

<i class="fa-regular fa-comments"></i>

</button>

<button class="toolbar-btn">

<i class="fa-solid fa-inbox"></i>

</button>

<button class="toolbar-btn">

<i class="fa-solid fa-users"></i>

</button>

<select id="agent-status">

<option>Fuera de la cola</option>

<option>Disponible</option>

<option>Ocupado</option>

<option>Ausente</option>

<option>Descanso</option>

<option>Comida</option>

<option>Capacitación</option>

</select>

<div class="avatar">

JV

</div>

</div>

</header>

<main class="layout">

<!-- ========================= -->
<!-- BARRA LATERAL -->
<!-- ========================= -->

<aside class="sidebar">

    <button class="side-icon active">
        <i class="fa-regular fa-comments"></i>
    </button>

    <button class="side-icon">
        <i class="fa-solid fa-phone"></i>
    </button>

    <button class="side-icon">
        <i class="fa-solid fa-inbox"></i>
    </button>

    <button class="side-icon">
        <i class="fa-solid fa-book"></i>
    </button>

    <button class="side-icon">
        <i class="fa-solid fa-chart-simple"></i>
    </button>

    <button class="side-icon">
        <i class="fa-solid fa-gear"></i>
    </button>

</aside>

<!-- ========================= -->
<!-- CONVERSACIONES -->
<!-- ========================= -->

<section class="conversation-panel">

    <div class="panel-top">

        <h2>

            Conversaciones

        </h2>

        <button>

            <i class="fa-solid fa-plus"></i>

        </button>

    </div>

    <div class="conversation-search">

        <i class="fa-solid fa-magnifying-glass"></i>

        <input
        type="text"
        placeholder="Buscar conversación">

    </div>

    <div class="conversation-list">

        <div class="empty-state">

            <i class="fa-regular fa-comments"></i>

            <h3>

                No hay conversaciones

            </h3>

            <p>

                Esperando una nueva interacción...

            </p>

        </div>

    </div>

</section>

<!-- ========================= -->
<!-- CHAT -->
<!-- ========================= -->

<section class="chat-panel">

    <header class="chat-header">

        <div class="customer-info">

            <div class="customer-avatar">

                FB

            </div>

            <div>

                <strong>

                    Facebook Messenger

                </strong>

                <small>

                    Sin interacción

                </small>

            </div>

        </div>

        <div class="chat-actions">

            <button>

                <i class="fa-solid fa-phone"></i>

            </button>

            <button>

                <i class="fa-solid fa-video"></i>

            </button>

            <button>

                <i class="fa-solid fa-ellipsis"></i>

            </button>

        </div>

    </header>

    <div id="chat-area">

        <div class="welcome">

            <i class="fa-regular fa-comments"></i>

            <h2>

                No hay conversaciones activas

            </h2>

            <p>

                Las conversaciones aparecerán aquí.

            </p>

        </div>

    </div>

    <!-- ========================= -->
    <!-- CAJA DE MENSAJE -->
    <!-- ========================= -->

    <footer class="chat-footer">

        <button class="attach-btn">

            <i class="fa-solid fa-paperclip"></i>

        </button>

        <input
            id="message-input"
            type="text"
            placeholder="Escribe un mensaje...">

        <button
            id="send-btn">

            <i class="fa-solid fa-paper-plane"></i>

        </button>

    </footer>

</section>

<!-- ========================= -->
<!-- PERFIL -->
<!-- ========================= -->

<aside class="profile-panel">

    <div class="panel-header">

        <h3>

            Perfil

        </h3>

    </div>

    <div class="profile-content">

        <div class="profile-avatar">

            <i class="fa-solid fa-user"></i>

        </div>

        <div class="profile-item">

            <label>Nombre</label>

            <span id="customer-name">

                Sin interacción

            </span>

        </div>

        <div class="profile-item">

            <label>Cuenta</label>

            <span id="customer-account">

                —

            </span>

        </div>

        <div class="profile-item">

            <label>Dirección</label>

            <span id="customer-address">

                —

            </span>

        </div>

        <div class="profile-item">

            <label>Segmento</label>

            <span id="customer-segment">

                —

            </span>

        </div>

    </div>

</aside>

<!-- ========================= -->
<!-- BIBLIOTECA -->
<!-- ========================= -->

<aside class="knowledge-panel">

    <div class="panel-header">

        <h3>

            Biblioteca

        </h3>

    </div>

    <div class="knowledge-search">

        <input
            type="text"
            placeholder="Buscar respuesta...">

    </div>

    <div id="knowledge-list">

    </div>

</aside>

</main>

</div>

<!-- ========================= -->
<!-- FORMADOR -->
<!-- ========================= -->

<div
id="trainer-view"
style="display:none;">

</div>

<script src="firebase.js"></script>

<script src="app.js"></script>

<script src="trainer.js"></script>

<script src="cases.js"></script>

</body>

</html>
